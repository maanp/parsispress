name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Give the checkout a usable git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # `npm run build` runs scripts/prepare-deploy.mjs, which derives the
      # deployment path and site URL from the origin remote. The vars below are
      # optional overrides for cases the remote cannot express, such as a
      # custom domain.
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Verify the export is complete
        run: |
          test -f out/index.html
          test -f out/404.html

          # .nojekyll is a dotfile. Without it Jekyll discards _next/, which
          # renders the whole site unstyled. Assert it is present rather than
          # discovering the problem in a browser.
          test -f out/.nojekyll || {
            echo "::error::out/.nojekyll is missing — Jekyll would strip _next/";
            exit 1;
          }

          # Every page must reference a stylesheet that exists in the export.
          # The href includes the deployment base path (e.g. /repo/_next/...),
          # which is not a directory inside out/ — strip it before checking.
          base=$(grep '^NEXT_PUBLIC_BASE_PATH=' .env.local | cut -d= -f2-)
          css_path=$(grep -o 'href="[^"]*\.css"' out/index.html | head -1 | sed 's/href="//;s/"//')
          css_rel=${css_path#"$base"}
          test -f "out${css_rel}" || {
            echo "::error::Stylesheet referenced but not exported: $css_path";
            echo "Looked for: out${css_rel}";
            echo "A sub-path deployment needs NEXT_PUBLIC_BASE_PATH to match where Pages serves the site.";
            exit 1;
          }

          # When a custom domain is declared, Pages serves the site from the
          # domain root. A non-empty base path there means every asset 404s.
          if [ -f public/CNAME ] && [ -n "$base" ]; then
            echo "::error::public/CNAME declares a custom domain but base path is '$base'.";
            echo "A custom domain is served from the root; the build must use an empty base path.";
            exit 1;
          fi

          echo "verified: .nojekyll present, stylesheet at $css_path"
          echo "serving at: $(cat .env.local | grep NEXT_PUBLIC_SITE_URL | cut -d= -f2-)${base}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4